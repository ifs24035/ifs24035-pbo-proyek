<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base}"
>
  <head>
    <title>Masuk - Nuel's Pawtopia</title>
    
    <!-- === TAMBAHKAN BARIS INI (FAVICON) === -->
    <link rel="icon" type="image/png" href="/assets/images/hewan-new.png">
    
    <!-- 1. LOAD FONT AWESOME & GOOGLE FONTS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- 2. CSS DIPERBAIKI AGAR TAMPILAN TIDAK RUSAK -->
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f4efff 0%, #e8dcff 100%);
            min-height: 100vh;
        }

        .auth-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(74, 59, 115, 0.1);
            background: #ffffff;
            position: relative;
            z-index: 2;
            overflow: hidden;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            color: #4a3b73;
            font-size: 1.8rem;
            letter-spacing: 0.5px;
        }

        /* Styling Input Group agar menyatu */
        .input-group {
            border: 1px solid #e8dcff;
            border-radius: 12px;
            overflow: hidden; /* Penting agar sudut radius tidak bocor */
            background-color: #fcfaff;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: #7b5edb;
            box-shadow: 0 0 0 4px rgba(123, 94, 219, 0.1);
            background-color: #fff;
        }

        /* Ikon di sebelah kiri */
        .input-group-text {
            background-color: transparent;
            border: none;
            color: #7b5edb; /* Warna ungu agar terlihat */
            padding-left: 15px;
            padding-right: 10px;
        }

        /* Kotak Input */
        .form-control {
            border: none;
            background-color: transparent;
            padding: 12px 5px;
            font-size: 0.95rem;
            color: #4a3b73;
        }

        .form-control:focus {
            box-shadow: none; /* Hilangkan shadow default bootstrap */
            background-color: transparent;
        }

        /* Tombol Utama */
        .btn-primary {
            background-color: #7b5edb;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #6a4ec9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(123, 94, 219, 0.3);
        }

        /* Tombol Mata Password */
        .password-toggle {
            cursor: pointer;
            color: #a095c4;
            padding-right: 15px;
            transition: color 0.3s;
        }
        
        .password-toggle:hover {
            color: #7b5edb;
        }

        /* Link */
        a { color: #7b5edb; text-decoration: none; font-weight: 600; }
        a:hover { color: #6a4ec9; text-decoration: underline; }

        /* Dekorasi Background Paw */
        .bg-decoration-paw {
            position: fixed;
            color: #d7c6ff;
            opacity: 0.2;
            z-index: 1;
            pointer-events: none;
        }
        
        .paw-1 { top: -50px; right: -50px; font-size: 300px; transform: rotate(20deg); }
        .paw-2 { bottom: -30px; left: -30px; font-size: 200px; transform: rotate(-15deg); }
    </style>
  </head>
  <body>
    
    <div layout:fragment="content" class="d-flex align-items-center justify-content-center position-relative" style="min-height: 80vh;">
      
      <!-- Dekorasi Background -->
      <i class="fas fa-paw bg-decoration-paw paw-1"></i>
      <i class="fas fa-paw bg-decoration-paw paw-2"></i>

      <form
        th:action="@{/auth/login/post}"
        method="post"
        th:object="${loginForm}"
        class="w-100 position-relative"
        style="z-index: 2;"
      >
        <div class="card auth-card mx-auto p-4" style="max-width: 420px">
          <div class="card-body">
            
            <!-- Header Logo -->
            <div class="text-center mb-4">
                <div class="d-inline-block p-3 rounded-circle bg-light mb-3 shadow-sm">
                    <i class="fas fa-paw fa-2x" style="color: #7b5edb;"></i>
                </div>
                <h5 class="brand-title">Masuk Akun</h5>
                <p class="text-muted small">
                  Selamat datang kembali di <br><strong>Nuel's Pawtopia</strong>
                </p>
            </div>

            <!-- Pesan Error -->
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger shadow-sm border-0 small rounded-3 mb-4">
                <i class="fas fa-exclamation-circle me-1"></i> 
                <th:block th:each="err : ${#fields.globalErrors()}" th:text="${err}"></th:block>
            </div>

            <!-- Input Email -->
            <div class="form-group mb-4">
              <label for="inputEmail" class="small fw-bold text-secondary mb-2 ms-1">Email</label>
              
              <!-- Wrapper Input Group -->
              <div class="input-group d-flex align-items-center">
                  <span class="input-group-text">
                      <i class="fas fa-envelope"></i>
                  </span>
                  <input
                    type="email"
                    class="form-control"
                    id="inputEmail"
                    th:field="*{email}"
                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                    placeholder="nama@email.com"
                    autocomplete="email"
                  />
              </div>
              
              <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1 ms-1">
                <th:block th:each="err : ${#fields.errors('email')}" th:text="${err}"></th:block>
              </div>
            </div>

            <!-- Input Password dengan Toggle -->
            <div class="form-group mb-3">
              <label for="inputPassword" class="small fw-bold text-secondary mb-2 ms-1">Kata Sandi</label>
              
              <!-- Wrapper Input Group -->
              <div class="input-group d-flex align-items-center">
                  <span class="input-group-text">
                      <i class="fas fa-lock"></i>
                  </span>
                  
                  <input
                    type="password"
                    class="form-control"
                    id="inputPassword"
                    th:field="*{password}"
                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                    autocomplete="current-password"
                    placeholder="Masukkan kata sandi"
                  />
                  
                  <!-- Tombol Mata -->
                  <span class="input-group-text password-toggle bg-transparent border-0" id="togglePasswordBtn">
                      <i class="fas fa-eye-slash" id="toggleIcon"></i>
                  </span>
              </div>
              
              <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1 ms-1">
                <th:block th:each="err : ${#fields.errors('password')}" th:text="${err}"></th:block>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-group mb-4 form-check ms-1">
              <input
                type="checkbox"
                class="form-check-input"
                id="optionRememberMe"
                th:field="*{rememberMe}"
                style="cursor: pointer;"
              />
              <label class="form-check-label small text-secondary" for="optionRememberMe" style="cursor: pointer;">
                Ingat saya
              </label>
            </div>

            <!-- Tombol Masuk -->
            <div class="d-grid gap-2 mb-4">
              <button type="submit" class="btn btn-primary shadow-sm">
                Masuk Sekarang
              </button>
            </div>

            <!-- Footer Card -->
            <div class="text-center pt-3 border-top">
              <p class="small text-muted mb-0">
                Belum memiliki akun?
                <a th:href="@{/auth/register}" class="fw-bold">Daftar di sini</a>
              </p>
            </div>

          </div>
        </div>
      </form>

      <!-- SCRIPT FUNCTIONAL -->
      <script>
        // Pastikan script berjalan setelah DOM siap
        document.addEventListener("DOMContentLoaded", function() {
            const toggleBtn = document.getElementById("togglePasswordBtn");
            const passwordInput = document.getElementById("inputPassword");
            const toggleIcon = document.getElementById("toggleIcon");

            if (toggleBtn && passwordInput && toggleIcon) {
                toggleBtn.addEventListener("click", function() {
                    // Cek tipe saat ini
                    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                    passwordInput.setAttribute("type", type);
                    
                    // Ganti Ikon
                    if (type === "text") {
                        toggleIcon.classList.remove("fa-eye-slash");
                        toggleIcon.classList.add("fa-eye");
                        toggleIcon.style.color = "#7b5edb"; // Highlight warna saat on
                    } else {
                        toggleIcon.classList.remove("fa-eye");
                        toggleIcon.classList.add("fa-eye-slash");
                        toggleIcon.style.color = ""; // Reset warna
                    }
                });
            }
        });
      </script>

    </div>
  </body>
</html>
