<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tambah Hewan - Nuel's Pawtopia</title>
    <link rel="icon" type="image/png" href="/assets/images/hewan-new.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f4efff 0%, #e8dcff 100%);
            min-height: 100vh;
            color: #4a3b73;
        }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(74, 59, 115, 0.08); }
        .card-header { background-color: #ffffff; border-bottom: 2px solid #f4efff; color: #4a3b73; border-radius: 20px 20px 0 0 !important; padding: 1.5rem; }
        .header-title { font-family: 'Fredoka', sans-serif; letter-spacing: 0.5px; }
        .form-label { font-weight: 500; color: #6a5a99; font-size: 0.9rem; }
        .form-control, .form-select { border-radius: 12px; border: 1px solid #e8dcff; background-color: #fcfaff; padding: 10px 15px; color: #4a3b73; }
        .form-control:focus, .form-select:focus { background-color: #fff; border-color: #7b5edb; box-shadow: 0 0 0 4px rgba(123, 94, 219, 0.1); }
        .btn-primary { background-color: #7b5edb; border: none; border-radius: 12px; padding: 12px; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary:hover { background-color: #6a4ec9; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(123, 94, 219, 0.3); }
        .btn-outline-secondary { border-radius: 12px; padding: 12px; color: #8d7fb8; border-color: #d9caff; }
        .btn-outline-secondary:hover { background-color: #f4efff; color: #6a4ec9; border-color: #7b5edb; }
        .input-group-text { background-color: #f8f5ff; border: 1px solid #e8dcff; color: #7b5edb; border-radius: 12px 0 0 12px; }
        .category-box { background-color: #f9f6ff; border: 1px dashed #7b5edb; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container mt-5 mb-5" style="max-width: 700px;">
    <div class="card">
        
        <div class="card-header text-center">
            <h4 class="mb-0 header-title fw-bold">
                <i class="fas fa-plus-circle me-2 text-primary" style="color: #7b5edb !important;"></i>Tambah Data Hewan
            </h4>
            <small class="text-muted">Masukkan informasi hewan titipan baru</small>
        </div>

        <div class="card-body p-4 p-md-5">
            
            <!-- UPDATE: MENAMPILKAN PESAN ERROR -->
            <div th:if="${error}" class="alert alert-danger border-0 shadow-sm rounded-3 mb-4">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${error}">Error message</span>
            </div>

            <form th:action="@{/pets/add}" th:object="${pet}" method="post">
                
                <div class="mb-4">
                    <label class="form-label">Jenis Hewan</label>
                    <select class="form-select" id="typeSelect" th:field="*{petType}" onchange="handleTypeChange()" required>
                        <option value="Anjing">Anjing</option> 
                        <option value="Kucing">Kucing</option>
                        <option value="Burung">Burung</option>
                        <option value="Kelinci">Kelinci</option>
                        <option value="Hamster">Hamster</option>
                        <option value="Marmut">Marmut</option>
                        <option value="Lainnya">Lainnya (Reptil kecil, dll)</option>
                    </select>
                </div>

                <!-- Kategori ANJING -->
                <div class="mb-4 p-3 category-box" id="anjingCategoryDiv" style="display: none;">
                    <label class="form-label text-primary" style="color: #7b5edb !important;">
                        <i class="fas fa-dog me-1"></i> Kriteria Anjing
                    </label>
                    <select class="form-select" id="anjingCat" name="petCategory" th:field="*{petCategory}">
                        <option value="" disabled selected>-- Pilih Ukuran --</option>
                        <option value="Kecil">Kecil (Rp 2.700/jam)</option>
                        <option value="Sedang">Sedang (Rp 4.200/jam)</option>
                        <option value="Besar">Besar (Rp 7.700/jam)</option>
                    </select>
                </div>

                <!-- Kategori KUCING -->
                <div class="mb-4 p-3 category-box" id="kucingCategoryDiv" style="display: none; border-color: #ffc107;">
                    <label class="form-label text-warning">
                        <i class="fas fa-cat me-1"></i> Kriteria Kucing
                    </label>
                    <select class="form-select" id="kucingCat" name="petCategory" th:field="*{petCategory}">
                        <option value="" disabled selected>-- Pilih Kelas --</option>
                        <option value="Standar">Standar (Rp 1.700/jam)</option>
                        <option value="Premium">Premium (Rp 3.800/jam)</option>
                        <option value="VIP">VIP (Rp 9.400/jam)</option>
                    </select>
                </div>

                <!-- Input Manual (LAINNYA) -->
                <div class="mb-4 p-3 category-box" id="otherTypeDiv" style="display: none; border-color: #20c997;">
                    <label class="form-label text-success" style="color: #20c997 !important;">
                        <i class="fas fa-paw me-1"></i> Masukkan Jenis Hewan Lainnya
                    </label>
                    <!-- Perlu sedikit logic thymeleaf untuk value manual jika gagal -->
                    <input type="text" name="otherType" id="otherTypeInput" class="form-control" 
                           placeholder="Contoh: Iguana, Kura-kura"
                           th:value="${pet.petType != 'Anjing' and pet.petType != 'Kucing' and pet.petType != 'Burung' and pet.petType != 'Kelinci' and pet.petType != 'Hamster' and pet.petType != 'Marmut' ? pet.petType : ''}">
                    <small class="text-muted mt-1 d-block"><i class="fas fa-info-circle me-1"></i> Biaya flat Rp 1.100/jam</small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Jumlah</label>
                    <input type="number" class="form-control" th:field="*{quantity}" min="1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Deskripsi</label>
                    <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Nama hewan (jika ada), ciri-ciri fisik, dan sebagainya." required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nama Pemilik</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" th:field="*{ownerName}" placeholder="Nama pemilik" required>
                    </div>
                </div>

                <div class="mb-5">
                    <label class="form-label">Nomor HP Pemilik</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input type="text" class="form-control" th:field="*{ownerPhone}" 
                               required minlength="9" maxlength="15" 
                               pattern="[0-9]+" inputmode="numeric"
                               oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                               title="Hanya angka diperbolehkan (0-9)"
                               placeholder="Contoh: 0812...">
                    </div>
                    <div class="form-text ms-1 text-muted" style="font-size: 0.8rem;">Hanya angka (0-9), minimal 9 digit.</div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary shadow-sm">
                        <i class="fas fa-save me-2"></i>Simpan Data
                    </button>
                    <a href="/" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>Batal & Kembali
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function handleTypeChange() {
        const typeSelect = document.getElementById('typeSelect');
        if (!typeSelect) return;

        const type = typeSelect.value;
        
        const anjingDiv = document.getElementById('anjingCategoryDiv');
        const kucingDiv = document.getElementById('kucingCategoryDiv');
        const otherDiv = document.getElementById('otherTypeDiv');
        
        const anjingInput = document.getElementById('anjingCat');
        const kucingInput = document.getElementById('kucingCat');
        const otherInput = document.getElementById('otherTypeInput');

        // Reset display
        anjingDiv.style.display = 'none';
        kucingDiv.style.display = 'none';
        otherDiv.style.display = 'none';

        // Hapus required & matikan name agar tidak terkirim
        anjingInput.removeAttribute('required');
        kucingInput.removeAttribute('required');
        otherInput.removeAttribute('required');
        
        anjingInput.name = "ignoreCategory"; 
        kucingInput.name = "ignoreCategory"; 

        // Logic Display & Enable Field
        if (type === 'Anjing') {
            anjingDiv.style.display = 'block';
            anjingInput.setAttribute('required', 'required');
            anjingInput.name = "petCategory"; // Aktifkan field ini

        } else if (type === 'Kucing') {
            kucingDiv.style.display = 'block';
            kucingInput.setAttribute('required', 'required');
            kucingInput.name = "petCategory"; // Aktifkan field ini

        } else if (type === 'Lainnya') {
            otherDiv.style.display = 'block';
            otherInput.setAttribute('required', 'required');
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        handleTypeChange();
    });
</script>

</body>
</html>
