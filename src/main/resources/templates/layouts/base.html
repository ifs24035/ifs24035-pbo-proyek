<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  lang="id"
>
  <head>
    <!-- Meta -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- 1. Favicon (Jejak Kaki) -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/107/107831.png">

    <!-- 2. Judul Dinamis -->
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Nuel's Pawtopia</title>

    <!-- 3. Fonts (Fredoka & Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- 4. Styles Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- 5. Global Custom CSS (Theming Nuel's Pawtopia) -->
    <style>
        :root {
            --primary-purple: #7b5edb;
            --dark-purple: #4a3b73;
            --soft-purple-bg: #f4efff;
            --gradient-start: #f4efff;
            --gradient-end: #e8dcff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            min-height: 100vh;
            color: var(--dark-purple);
        }

        /* Headings pakai Font Lucu */
        h1, h2, h3, h4, h5, h6, .brand-font, .swal2-title {
            font-family: 'Fredoka', sans-serif !important;
            letter-spacing: 0.5px;
        }

        /* Override Bootstrap Buttons agar Ungu */
        .btn-primary {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }
        
        .btn-primary:hover {
            background-color: #6a4ec9;
            border-color: #6a4ec9;
        }

        /* Scrollbar Cantik */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbbceb; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-purple); }

        /* === UPDATE: CUSTOM STYLE UNTUK SWEETALERT (POPUP) === */
        
        /* 1. Membuat popup rounded */
        div:where(.swal2-container) div:where(.swal2-popup) {
            border-radius: 20px !important;
            overflow: hidden; /* Agar ikon tidak keluar kotak */
        }

        /* 2. Menyisipkan Ikon Paw (Watermark) di belakang */
        div:where(.swal2-container) div:where(.swal2-popup)::before {
            content: "\f1b0"; /* Kode Unicode FontAwesome untuk 'Paw' */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg); /* Posisi tengah & miring dikit */
            font-size: 12rem; /* Ukuran Besar */
            color: var(--primary-purple);
            opacity: 0.08; /* Transparan Soft */
            z-index: 0; /* Di belakang teks */
            pointer-events: none;
        }

        /* 3. Memastikan konten (Teks/Tombol) ada di depan watermark */
        .swal2-html-container, .swal2-actions, .swal2-icon, .swal2-title {
            position: relative;
            z-index: 1;
        }
    </style>

    <!-- Slot untuk CSS tambahan per halaman -->
    <th:block layout:fragment="others-css"></th:block>
  </head>

  <body>
    <!-- Slot untuk konten utama -->
    <div layout:fragment="content" class="container-fluid p-0">
      <!-- Konten akan diisi oleh child templates -->
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Script Global SweetAlert (Notification) -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        /* Warna Ungu Nuel's Pawtopia */
        const themeColor = '#7b5edb';

        /* Ambil pesan sukses dari Controller */
        const successMessage = "[[${success}]]";
        if (successMessage && successMessage !== 'null' && successMessage.length > 0) {
          Swal.fire({
            icon: "success",
            title: "Berhasil!",
            text: successMessage,
            confirmButtonColor: themeColor,
            confirmButtonText: 'Oke, Siap!',
            background: '#fff', // Pastikan background putih agar watermark terlihat
            iconColor: themeColor // Ubah warna centang jadi ungu juga biar serasi
          });
        }

        /* Ambil pesan error dari Controller */
        const errorMessage = "[[${error}]]";
        if (errorMessage && errorMessage !== 'null' && errorMessage.length > 0) {
          Swal.fire({
            icon: "error",
            title: "Gagal...",
            text: errorMessage,
            confirmButtonColor: '#ff6b6b',
            confirmButtonText: 'Coba Lagi'
          });
        }
      });
    </script>

    <!-- Slot untuk JavaScript tambahan per halaman -->
    <th:block layout:fragment="others-js"></th:block>
  </body>
</html>
